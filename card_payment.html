


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="css_for_card_payment.css">

</head>
<body>

    <!--nav-list-->
    <ul class="navbar">
        <a href="faqe_kryesore.html" class="home-active">Kreu</a>
        <a href="menu.html">Menu</a>
        <a href="delivery.html">Delivery</a>
        <a href="rezervime.html">Rezervime</a>
        <a href="cart.html">Cart</a>
        <a href="reviews.html">Reviews</a>
        </ul>



    <div class="payment-container">
        <h1>Card Payment</h1>
        <form id="payment-form">

            <!-- Ammount -->
            <div class="form-group">
                <label for="name-on-card">Klienti</label>
                <input type="text" id="name-on-card" name="name-on-card" placeholder="Emer Mbiemer" required>
                <span class="error-message" id="name-on-card-error"></span>
            </div>

            <!-- Card Details -->
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456" required>
                <span class="error-message" id="card-number-error"></span>
            </div>
            <div class="form-group">
                <label for="expiry-date">Expiry Date</label>
                <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY" required>
                <span class="error-message " id="expiry-date-error"></span>
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" placeholder="123" required>
                <span class="error-message" id="cvv-error"></span>
            </div>

            <!---Ammount--->
            <div class="form-group">
                <label for="billing-address">Tips</label>
                <input type="text" id="billing-address" name="billing-address" placeholder="Leke, euro, dollare" required>
                <span class="error-message" id="billing-address-error"></span>
            </div>

                        <!---Ammount--->
                        <div class="form-group" id="bosh">
                            <label for="billing-address"></label>
                        </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit">Paguaj</button>
            </div>
        </form>
    </div>

    <!-- jQuery for Validation -->
    <script>
        $(document).ready(function () {
            // Form Submission Handler
            $('#payment-form').on('submit', function (e) {
                e.preventDefault(); // Prevent default form submission

                // Clear previous error messages
                $('.error-message').text('');

                // Validate Card Number (16 digits)
                const cardNumber = $('#card-number').val().replace(/\s/g, '');
                if (!/^\d{16}$/.test(cardNumber)) {
                    $('#card-number-error').text('Please enter a valid 16-digit card number.');
                    return;
                }

                // Validate Expiry Date (MM/YY format)
                const expiryDate = $('#expiry-date').val();
                if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiryDate)) {
                    $('#expiry-date-error').text('Please enter a valid expiry date (MM/YY).');
                    return;
                }

                // Validate CVV (3 or 4 digits)
                const cvv = $('#cvv').val();
                if (!/^\d{3,4}$/.test(cvv)) {
                    $('#cvv-error').text('Please enter a valid CVV (3 or 4 digits).');
                    return;
                }

                // Validate Name on Card (non-empty)
                const nameOnCard = $('#name-on-card').val();
                if (nameOnCard.trim() === '') {
                    $('#name-on-card-error').text('Please enter the name on the card.');
                    return;
                }

                // Validate Billing Address (non-empty)
                const billingAddress = $('#billing-address').val();
                if (billingAddress.trim() === '') {
                    $('#billing-address-error').text('Please enter the billing address.');
                    return;
                }

                // If all validations pass, simulate successful payment
                alert('Payment successful! Redirecting...');
                $('#payment-form')[0].reset(); // Reset the form
            });
        });
    </script>
</body>
</html>
