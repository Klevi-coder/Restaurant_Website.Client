<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porosit tani</title>
    <link rel="stylesheet" href="css_for_delivery.css">
    <style>
        /* Modal styles */
        .modal {
            display: none; /* Initially hidden */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 80%;
            height: 80%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 10px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <ul class="navbar">
        <a href="faqe_kryesore.html" class="home-active">Faqe Kryesore</a>
        <a href="menu.html">Menu</a>
        <a href="delivery.html">Delivery</a>
        <a href="rezervime.html">Rezervime</a>
        <a href="cart.html">Cart</a>
        <a href="reviews.html">Reviews</a>
    </ul>

    <p>𝓟𝓸𝓻𝓸𝓼𝓲𝓣 𝓣𝓪𝓷𝓲</p>

    <div class="form-container">
        <form id="orderForm">
            <label for="customerName">Porositesi/ja:</label>
            <input type="text" id="customerName" name="customerName" required>
    
            <label for="product">Produkti:</label>
            <input type="text" id="product" name="product" required>
    
            <label for="quantity">Sasia:</label>
            <input type="text" id="quantity" name="quantity" required>
    
            <label for="adress">Adresa:</label>
            <input type="text" id="adress" name="adress" required>
    
            <label for="paymentMethod">Metoda e Pageses:</label>
            <select id="paymentMethod" name="paymentMethod" required>
                <option value="cash">Cash</option>
                <option value="card">Card</option>
            </select>
    
            <button type="button" id="kryej_porosine">Kryej Porosine</button>
        </form>
    </div>

    <!-- Modal for order confirmation -->
    <div id="notification" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Detajet e Porosise</h2>
            <div id="notificationDetails"></div>
        </div>
    </div>

    <script>
        document.getElementById('kryej_porosine').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent form submission

            // Get form values
            const product = document.getElementById('product').value;
            const customerName = document.getElementById('customerName').value;
            const quantity = document.getElementById('quantity').value;
            const address = document.getElementById('adress').value; // Fixed ID here
            const paymentMethod = document.getElementById('paymentMethod').value;

            // Create the invoice details
            const invoiceDetails = `
                <p><strong>Produkti:</strong> ${product}</p>
                <p><strong>Emri i Porositësit:</strong> ${customerName}</p>
                <p><strong>Sasia:</strong> ${quantity}</p>
                <p><strong>Adresa:</strong> ${address}</p>
                <p><strong>Metoda e Pageses:</strong> ${paymentMethod}</p>
            `;

            // Display the invoice in the modal
            document.getElementById('notificationDetails').innerHTML = invoiceDetails;

            // Show the modal
            document.getElementById('notification').style.display = 'block';

            // If payment method is card, redirect to card.html after a short delay
            if (paymentMethod === "card") {
                setTimeout(() => {
                    window.location.href = "card_payment.html"; // Redirect to card payment page
                }, 5000); // Redirects after 5 seconds
            }
        });

        // Close the modal when the user clicks on <span> (x)
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('notification').style.display = 'none';
        });

        // Close the modal when the user clicks anywhere outside of the modal
        window.onclick = function(event) {
            const modal = document.getElementById('notification');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>
</html>
