<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in / Sign up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css_for_login_signup.css">
    <script src="js_for_login_signup.js" defer></script>
</head>
<body>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css">

    <!--nav-list-->
    <ul class="navbar">
        <a href="faqe_kryesore.html" class="home-active">Faqe Kryesore</a>
        <a href="menu.html">Menu</a>
        <a href="delivery.html">Delivery</a>
        <a href="rezervime.html">Rezervime</a>
        <a href="cart.html">Cart</a>
        <a href="reviews.html">Reviews</a>
    </ul>

    <div id="loginContainer" class="container">
        <h2>Sign In</h2>
        <p>Enter your email and password</p>
        <input type="email" id="login-email" placeholder="Email">
        <div class="password-container">
            <input type="password" id="login-password" placeholder="Password">
            <span class="toggle-password" onclick="togglePassword('login-password')">
                <i class="bx bx-low-vision" id="eye-icon-login"></i>
            </span>
        </div>
        <button class="primary" onclick="login()">LOGIN</button>
        <p class="switch">Don't have an account? <a href="#" onclick="showSignup()">Sign up</a></p>
    </div>

    <div id="signupContainer" class="container" style="display: none;">
        <h2>Sign Up</h2>
        <p>Create your account</p>
        <input type="text" id="signup-fullname" placeholder="Full name">
        <input type="email" id="signup-email" placeholder="Email">
        <div class="password-container">
            <input type="password" id="signup-password" placeholder="Password">
            <span class="toggle-password" onclick="togglePassword('signup-password')">
                <i class="bx bx-low-vision" id="eye-icon-signup"></i>
            </span>
        </div>
        <div class="password-container">
            <input type="password" id="signup-confirm-password" placeholder="Confirm your password">
            <span class="toggle-password" onclick="togglePassword('signup-confirm-password')">
                <i class="bx bx-low-vision" id="eye-icon-confirm"></i>
            </span>
        </div>
        <p class="error-message" id="signup-error-message" style="display: none;">Passwords do not match.</p>
        <button class="primary" onclick="signup()">SIGN UP</button>
        <p class="switch">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>
</body>
</html>
