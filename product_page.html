
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        /* Basic styling for the product box */
        .box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            max-width: 200px;
            margin: 20px;
            position: relative;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .box img {
            max-width: 100%;
            border-radius: 8px;
        }

        .box h2 {
            font-size: 18px;
            margin: 10px 0;
        }

        .box h3.price {
            font-size: 16px;
            color: #28a745;
            margin: 10px 0;
        }

        .box .discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff4b2b;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .box i {
            font-size: 24px;
            margin: 0 5px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .box i.bx-cart-alt:hover {
            color: #28a745; /* Green on hover */
        }

        .box i.bx-heart-square:hover {
            color: #ff4b2b; /* Red on hover */
        }

        /* Cart section styling */
        .cart-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: 50px auto;
        }

        .cart-container h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #cart-items {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .cart-item span {
            font-size: 18px;
            color: #444;
            font-weight: 500;
        }

        .cart-item .remove-item {
            font-size: 16px;
            color: #ff4b2b;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .cart-item .remove-item:hover {
            color: #ff416c;
        }

        .checkout {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .checkout:hover {
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Product Box -->
    <div class="box">
        <img src="img/p1.avif" alt="Crepes">
        <span>Crepes</span>
        <h2>Strawberry Short Crepe</h2>
        <h3 class="price ">4$</h3>
        <i class="bx bx-cart-alt" onclick="addToCart('Strawberry Short Crepe', 4)"></i>
        <i class="bx bx-heart-square"></i>
        <span class="discount">-20%</span>
    </div>

    <!-- Cart Section -->
    <div class="cart-container">
        <h1>Your Cart</h1>
        <div id="cart-items"></div>
        <button class="checkout" onclick="checkout()">Checkout</button>
    </div>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';

            cart.forEach((item, index) => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <span>${item.name} - $${item.price.toFixed(2)}</span>
                    <span class="remove-item" onclick="removeFromCart(${index})">Remove</span>
                `;
                cartItemsContainer.appendChild(cartItem);
            });
        }

        function addToCart(name, price) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
            alert(`${name} has been added to your cart!`);
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function checkout() {
            alert('Proceeding to checkout...');
            // Implement checkout logic here
        }

        // Load cart items on page load
        window.onload = loadCart;
    </script>
</body>
</html>
